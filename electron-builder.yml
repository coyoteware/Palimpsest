# Desktop packaging. `npm run dist:win` → release/Palimpsest-<version>-portable.exe
appId: io.github.coyoteware.palimpsest
productName: Palimpsest
copyright: Copyright © 2026 Coyoteware

directories:
  output: release
  buildResources: build

# The renderer is fully bundled by Vite into dist/; only the shell and the bundle ship.
files:
  - desktop/**
  - dist/**
  - "!dist/**/*.map"
  - package.json
asar: true
# The UI is English-only; dropping Chromium's other locale packs saves ~48 MB unpacked.
electronLanguages: [en-US]
# No auto-update channel; releases are downloaded from GitHub by hand.
publish: null

win:
  icon: public/icons/icon-512.png
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: public/icons/icon-512.png
  category: Office
  target: [dir]
