name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build the
# Windows portable exe and installer, test them, and publish a GitHub release.
# Run manually (Actions → Release → Run workflow) to get both as a workflow
# artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/edgedriver.ps1
      - name: Build the test app
        run: npx tauri build --debug --no-bundle --features e2e
      # The runner is elevated, and an elevated WebView2 ignores the debugging switch msedgedriver needs.
      - name: End-to-end tests (without administrator rights)
        shell: pwsh
        run: ./scripts/windows-unelevated.ps1 npx vitest run -c vitest.e2e.config.ts
      - name: Release build
        run: npm run dist
      - name: Smoke-test the release build
        shell: pwsh
        run: ./scripts/windows-unelevated.ps1 npx vitest run -c vitest.e2e.config.ts tests/e2e/shell.test.ts -t "command line"
        env:
          PALIMPSEST_APP: ${{ github.workspace }}\src-tauri\target\release\palimpsest.exe
      # Before the installer build, which stamps the binary as installed by NSIS.
      - name: Name the portable exe
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp src-tauri/target/release/palimpsest.exe "release/Palimpsest-${version}-portable.exe"
      - name: Installer
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run dist:installer
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "release/Palimpsest-${version}-setup.exe"
      - name: Test the installer (install, Open with, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Installer (Get-Item release/*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Palimpsest-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # If the release was already created by hand (e.g. on github.com), attach the tested builds to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.exe \
              --title "Palimpsest $GITHUB_REF_NAME" --generate-notes
          fi
