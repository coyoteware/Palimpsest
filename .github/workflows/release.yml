name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build the
# Windows portable exe, test it, and publish a GitHub release.
# Run manually (Actions → Release → Run workflow) to get the exe as a
# workflow artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/edgedriver.ps1
      - name: End-to-end tests (test build)
        run: npm run test:e2e
      - name: Release build
        run: npm run dist
      - name: Smoke-test the release build
        run: npx vitest run -c vitest.e2e.config.ts tests/e2e/shell.test.ts -t "command line"
        env:
          PALIMPSEST_APP: ${{ github.workspace }}\src-tauri\target\release\palimpsest.exe
      - name: Name the portable exe
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp src-tauri/target/release/palimpsest.exe "release/Palimpsest-${version}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Palimpsest-windows-portable
          path: release/*-portable.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # If the release was already created by hand (e.g. on github.com), attach the tested build to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*-portable.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*-portable.exe \
              --title "Palimpsest $GITHUB_REF_NAME" --generate-notes
          fi
