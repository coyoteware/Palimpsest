name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e-linux:
    name: End-to-end (Linux, WebKitGTK)
    # Pinned: Ubuntu 26.04 renames the WebKitGTK WebDriver package.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: WebKitGTK and its WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci
      - name: End-to-end tests
        run: |
          # WebKitGTK sandboxes its web process with user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:e2e

  e2e-windows:
    name: End-to-end (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/edgedriver.ps1
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Palimpsest-windows
          path: src-tauri/target/release/palimpsest.exe
          if-no-files-found: error
