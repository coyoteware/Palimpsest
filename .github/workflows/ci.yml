name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Desktop (Electron) tests
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox uses; allow them rather than test unsandboxed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  tauri-linux:
    name: Tauri shell (Linux, WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: WebKitGTK and its WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci
      - name: Tauri shell tests
        run: |
          # WebKitGTK sandboxes its web process with user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:tauri

  tauri-windows:
    name: Tauri shell (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Edge WebDriver matching the installed WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: npm run test:tauri
      - name: Portable exe
        run: npm run dist:tauri
      - uses: actions/upload-artifact@v4
        with:
          name: Palimpsest-tauri-windows
          path: src-tauri/target/release/palimpsest.exe
          if-no-files-found: error
