name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e-linux:
    name: End-to-end (Linux, WebKitGTK)
    # Pinned: Ubuntu 26.04 renames the WebKitGTK WebDriver package.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: WebKitGTK and its WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci
      - name: End-to-end tests
        run: |
          # WebKitGTK sandboxes its web process with user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:e2e

  e2e-windows:
    name: End-to-end (Windows, WebView2)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: ./scripts/edgedriver.ps1
      - name: Build the test app
        run: npx tauri build --debug --no-bundle --features e2e
      # The runner is elevated, and an elevated WebView2 ignores the debugging switch msedgedriver needs.
      - name: End-to-end tests (without administrator rights)
        shell: pwsh
        run: ./scripts/windows-unelevated.ps1 npx vitest run -c vitest.e2e.config.ts
      - name: Portable exe
        shell: bash
        run: |
          npm run dist
          mkdir -p release
          cp src-tauri/target/release/palimpsest.exe release/Palimpsest-portable.exe
      - name: Installer
        shell: bash
        run: |
          npm run dist:installer
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release/Palimpsest-setup.exe
      - name: Test the installer (install, Open with, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Installer release/Palimpsest-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Palimpsest-windows
          path: release/*.exe
          if-no-files-found: error
